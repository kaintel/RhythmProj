<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="note.js"></script>
    <script src="action.js"></script>
    <script src="minotaur.js"></script>
    <script src="monster2.js"></script>
    <script src="scorenote.js"></script>
    <script src="cloud.js"></script>
    <script src="sky.js"></script>
     <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
     <script src="kinema.js"></script>
     <script src="simplify.js"></script>
     <script src="health.js"></script>
  </head>

    <body >
      <a-scene id="scene" physics="debug: false; gravity: 0 0 0">
        <a-assets>
          <audio id="music1" src="sounds/ninelives.mp3" preload="auto"></audio>
           <a-assets-item id="floorTexture" src="images/floor.jpg"></a-assets-item>
          <!-- <a-assets-item id="sky" src="images/sky.jpg"></a-assets-item> -->
          <a-assets-item id="sky2" src="images/fan.jpeg"></a-assets-item>
          <a-assets-item id="forest" src="low_poly_environments_01/scene.gltf"></a-assets-item> 
          <a-assets-item id="mino" src="minotaur_low-poly/scene.gltf"></a-assets-item>
          <a-assets-item id="monster2" src="monsters_01/scene.gltf"></a-assets-item>
          <a-assets-item id="cloud"src="cloud_test/scene.gltf"></a-assets-item> 
          <a-assets-item id="wall" src="modular_dungeon_kit/onewall.glb"></a-assets-item>
          <!-- assets -->

        </a-assets>
       
        <a-gltf-model  scale = "5 5 5" src="#dungeon" position="0 -10 0" ></a-gltf-model>
        <a-gltf-model src="#forest" position="0 0 0" ></a-gltf-model>

        <a-entity id="mainRoom">
      <!-- front -->
          <a-gltf-model src="#wall" rotation="0 0 0" scale="5 5 1" position="0 0 -5"></a-gltf-model>
          <a-box depth="2.5" height="5" width="0.3" position="0 0 -5" id="wall" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" rotation="0 90 0" scale="5 5 5" position="-5.5 0 -5"></a-gltf-model>
          <a-box id="wall" depth="0.5" width="5" height="5" position="-3 0 -5" opacity="0 0 0" ></a-box>

      <!-- back -->
          <a-gltf-model src="#wall" rotation="0 180 0" scale="5 5 5" position="10 0 -5"></a-gltf-model>
          <a-box id="wall" depth="12" width="0.75" height="5" position="10 0 -5" opacity="0 0 0" ></a-box>

      <!-- left -->
          <a-gltf-model src="#wall" rotation="0 90 0" scale="5 5 5" position="5 0 -10"></a-gltf-model>
          <a-box id="wall" depth="0.7" height="5" width="12" position="5 0 -10" opacity="0 0 0" ></a-box>

      <!-- right -->
          <a-gltf-model src="#wall" rotation="0 -90 0" scale="5 5 5" position="5 0 0"></a-gltf-model>
          <a-box id="wall" depth="0.7" height="5" width="12" position="5 0 0" opacity="0 0 0" ></a-box>

        </a-entity>

        <a-entity id="hallway">
          <a-gltf-model src="#wall" scale="5 5 5" position="-5 0 -10"></a-gltf-model>
          <a-box id="wall" depth="9" width="1" height="5" position="-5 0 -10" opacity="0 0 0" ></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" position="-5 0 2"></a-gltf-model>
          <a-box id="wall" depth="10" width="1" height="5" position="-5 0 -1" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" rotation="0 -90 0" scale="5 5 5" position="1 0 -14"></a-gltf-model>
          <a-box id="wall" depth="1" width="11" height="5" position="1 0 -14" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" rotation="0 90 0" scale="5 5 5" position="1 0 4"></a-gltf-model>
          <a-box id="wall" depth="1" width="11" height="5" position="1 0 4" opacity="0 0 0"></a-box>
        </a-entity>

        <a-entity id="room1">
          <a-gltf-model src="#wall" scale="5 5 5" position="7 0 -19"></a-gltf-model>
          <a-box id="wall" depth="11" width="1" height="5" position="7 0 -19" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 -90 0" position="7 0 -24"></a-gltf-model>
          <a-box id="wall" depth="1" width="20" height="5" position="15 0 -24" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 -90 0" position="18 0 -24"></a-gltf-model>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 -180 0" position="24 0 -18.2"></a-gltf-model>
          <a-box id="wall" depth="45" width="1" height="5" position="24 0 -15" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 -180 0" position="24 0 -8"></a-gltf-model>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 90 0" position="18.5 0 -5"></a-gltf-model>
          <a-box id="wall" depth="1" width="17" height="5" position="18.5 0 -5" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 90 0" position="16 0 -5"></a-gltf-model>
        </a-entity>

        <a-entity id="room2">
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 -180 0" position="24 0 3"></a-gltf-model>
          <a-gltf-model src="#wall" scale="5 5 10" rotation="0 90 0" position="19 0 8"></a-gltf-model>
          <a-box id="wall" depth="1" width="20" height="5" position="14 0 8" opacity="0 0 0"></a-box>
          <a-gltf-model src="#wall" scale="5 5 5" rotation="0 180 0" position="7 0 9"></a-gltf-model>
          <a-box id="wall" depth="10" width="1" height="5" position="7 0 8.5" opacity="0 0 0"></a-box>
        </a-entity>


       
     
        <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="gray" material="src: #floorTexture;repeat: 30 30" static-body></a-plane>
      <!-- MainCamera -->
        <a-camera active id="mainCamera" position="7 1.5 -5" kinema-body="radius: 0.8">
          <a-cursor id="mainCursor" raycaster="objects: [interact]">
            <a-image id="Slain" scale="11 6 10" src="images/enemy_slain.png" opacity="0" position="0 0 -2"></a-image>
            <a-image id="Died" scale="11 6 10" src="images/died.png" opacity="0" position="0 0 -2"></a-image>
          </a-cursor>
        </a-camera>

     <!-- Enemy Camera -->
        <a-camera active="false" sound="src: #music1;loop:false;volume:2" id="cylinderCamera" position="-25 6 0" wasd-controls-enabled="false">
          <a-cursor raycaster="objects: [interact]" id="cylinderCursor">
            <a-text id="output" value="score" scale="0.2 0.2 0.2" position="-1.7 0.7 0"></a-text>
            <a-text id="output" value="combo" scale="0.2 0.2 0.2" position="-1.5 -0.6 0"></a-text>
          </a-cursor>
        </a-camera>

      </a-scene>

    </body>
</html>
